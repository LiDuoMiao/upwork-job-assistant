version: "1.0"

# 以下为软件开发类示例。按能力档案调整关键词、筛选重点和输出语言。
search:
  include_best_match_feed: true
  keyword_queries:
    - "API integration automation"
    - "backend development"
    - "internal tool development"
  title_queries:
    - "Backend developer"
    - "Full stack developer"
  max_candidates_for_detail: 8
  max_recommendations: 5

incremental_search:
  state_files:
    run_state: state/run-state.json
    job_history: state/job-history.json
  first_run_lookback_days: 7
  overlap_hours: 12
  max_regular_lookback_days: 7
  pagination:
    page_size: 10
    max_pages_per_route: 3
  carryover:
    reminder_days: 7
    max_detail_rechecks_per_run: 5
    recheck_statuses:
      - recommended
      - conditional
      - watch
  deep_backfill:
    enabled: true
    interval_days: 7
    lookback_days: 14
    max_pages_per_route: 5

project_preferences:
  job_types:
    - hourly
    - fixed
  preferred_skills: []
  preferred_project_types: []
  lower_priority_project_types: []
  # 可填 solo、team 或 either。null 表示由档案和当次请求决定。
  delivery_mode: null
  # 由当前用户确认实际可用工时、沟通方式与作品集状态。
  availability_hours_per_week: null
  communication_modes: []
  portfolio_links: []

commercial_assumptions:
  # null 表示未设置。填数字后再用于估算或筛选，避免把示例当成报价。
  profile_hourly_rate_usd: null
  hourly_rate_soft_floor_usd: null
  fixed_budget_soft_floor_usd: null

connects_strategy:
  # 需要折算现金成本时，填写已核对的单价。
  cost_per_connect_usd: null
  # 可选的投递成本提醒线。超过时说明投入是否值得，由使用者决定。
  elevated_cost_threshold: null
  recommend_boost: false

earnings_estimation:
  currency: USD
  # 未填且无法核对实际费率时，报告毛收入并标注净收入待确认。
  upwork_service_fee_min_percent: null
  upwork_service_fee_max_percent: null

hard_exclusions:
  - already_applied
  - inactive_or_closed_job
  - cannot_apply
  - explicit_eligibility_requirement_not_met
  - request_requires_false_claims_or_policy_violation
  - clearly_unrelated_role

scoring:
  total: 100
  dimensions:
    technical_match: 35
    delivery_confidence: 20
    budget_and_value: 15
    client_quality: 15
    timing_and_competition: 10
    requirement_clarity: 5
  levels:
    strongly_recommend: 80
    consider: 65
    low_priority: 50

output:
  language: zh-CN
  # 第一项供本人审阅，第二项用于候选投递稿。只需要一版时保留单项。
  proposal_languages:
    - zh-CN
    - en
  include_proposal_draft_for:
    - strongly_recommend
    - consider
  report_directory: reports
  include_compact_calibration_appendix: true
